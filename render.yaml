databases:
  - name: college-erp-db
    databaseName: erpdb
    user: erp_user
    plan: free

services:
  - type: web
    name: college-erp
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn CollegeERP.wsgi:application --workers 2 --timeout 120"
    preDeployCommand: "python manage.py migrate && python manage.py seed_data --no-attendance"
    healthCheckPath: /accounts/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: college-erp-db
          property: connectionString
