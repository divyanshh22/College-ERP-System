{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Teachers</title>
  <link href="{% static 'info/bootstrap/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'info/css/custom.css' %}" rel="stylesheet">
</head>
<body class="p-3" style="background: var(--bg);">
  <div class="card-modern card">
    <div class="card-header"><i class="fas fa-users mr-2 text-success"></i>List of Free Teachers</div>
    <div class="card-body">
      {% if ft_list %}
        <ul class="list-group">
          {% for t in ft_list %}
            <li class="list-group-item d-flex align-items-center">
              <span class="avatar mr-3">{{ t.name|first }}</span>
              {{ t }}
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p class="text-muted text-center my-3">No free teachers at this time slot.</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
