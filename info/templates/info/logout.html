<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Logged Out | CollegeERP</title>
  {% load static %}

  <link href="{% static 'info/bootstrap/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'info/css/custom.css' %}" rel="stylesheet">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card text-center">
      <div class="login-logo bg-success">
        <i class="fas fa-check"></i>
      </div>
      <h1 class="login-title">You have been logged out</h1>
      <p class="login-sub">Thank you for using CollegeERP. See you soon!</p>
      <a class="btn btn-primary btn-block" href="{% url 'login' %}">
        <i class="fas fa-sign-in-alt mr-1"></i> Login Again
      </a>
    </div>
  </div>

</body>
</html>
